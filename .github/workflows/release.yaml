              .component {
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                transition: border-color 0.2s, transform 0.2s;
              }
              .component:hover { border-color: var(--accent); transform: translateY(-2px); }
              .component h3 { font-size: 1.1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
              .component p { color: var(--text-secondary); font-size: 0.9rem; }
              .component .tag {
                display: inline-block;
                font-size: 0.75rem;
                padding: 2px 8px;
                border-radius: 12px;
                margin-left: auto;
              }
              .tag-core { background: rgba(59, 185, 80, 0.2); color: var(--success); }
              .tag-optional { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
              .links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
              .btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 500;
                transition: all 0.2s;
              }
              .btn-primary { background: var(--accent); color: var(--bg-primary); }
              .btn-primary:hover { background: var(--accent-hover); }
              .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
              .btn-secondary:hover { border-color: var(--accent); }
              .footer {
                text-align: center;
                padding: 40px 0;
                color: var(--text-secondary);
                border-top: 1px solid var(--border);
                margin-top: 60px;
              }
              .footer a { color: var(--accent); text-decoration: none; }
              .footer a:hover { text-decoration: underline; }
              @media (max-width: 600px) {
                .hero h1 { font-size: 1.8rem; }
                .hero p { font-size: 1rem; }
                .container { padding: 20px 16px; }
              }
            </style>
