name: Release Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Helm repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo add kiali https://kiali.org/helm-charts
          helm repo update

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
          cat Chart.yaml

      - name: Update dependencies
        run: helm dependency update

      - name: Lint chart
        run: helm lint .

      - name: Package chart
        run: |
          mkdir -p packages
          helm package . -d packages

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)
          
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from ${PREV_TAG} to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          
          # Escape for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "k8s-observability-stack v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          body: |
            ## k8s-observability-stack v${{ steps.version.outputs.version }}
            
            ### Installation
            
            ```bash
            # Add the Helm repository
            helm repo add k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack
            helm repo update
            
            # Install the chart
            helm install observability k8s-observability/k8s-observability-stack
            ```
            
            ### Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Assets
            
            - `k8s-observability-stack-${{ steps.version.outputs.version }}.tgz` - Helm chart package
          files: packages/*.tgz
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Create gh-pages branch if not exists
        run: |
          if [ ! -d "gh-pages" ]; then
            mkdir gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: Update Helm repository index
        run: |
          # Copy packaged chart
          cp packages/*.tgz gh-pages/
          
          # Generate or update index.yaml
          cd gh-pages
          if [ -f index.yaml ]; then
            helm repo index . --url https://theorigamicorporation.github.io/k8s-observability-stack --merge index.yaml
          else
            helm repo index . --url https://theorigamicorporation.github.io/k8s-observability-stack
          fi
          
          # Create a simple index.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>k8s-observability-stack Helm Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
              h1 { color: #333; }
              pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
              a { color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>k8s-observability-stack Helm Repository</h1>
            <p>Complete Kubernetes observability stack with VictoriaMetrics, Loki, Grafana, and more.</p>
            
            <h2>Quick Start</h2>
            <pre>
          helm repo add k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack
          helm repo update
          helm install observability k8s-observability/k8s-observability-stack
            </pre>
            
            <h2>Documentation</h2>
            <p>See the <a href="https://github.com/theorigamicorporation/k8s-observability-stack">GitHub repository</a> for full documentation.</p>
          </body>
          </html>
          EOF

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit -m "Release k8s-observability-stack v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Post release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully released **k8s-observability-stack** version **${{ needs.release.outputs.version || github.ref_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack" >> $GITHUB_STEP_SUMMARY
          echo "helm repo update" >> $GITHUB_STEP_SUMMARY
          echo "helm install observability k8s-observability/k8s-observability-stack" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
