                  <div class="component">
                    <h3>Grafana <span class="tag tag-core">Core</span></h3>
                    <p>Observability platform with dashboards and alerting</p>
                  </div>
                  <div class="component">
                    <h3>Loki <span class="tag tag-core">Core</span></h3>
                    <p>Horizontally-scalable log aggregation system</p>
                  </div>
                  <div class="component">
                    <h3>Alloy <span class="tag tag-core">Core</span></h3>
                    <p>OpenTelemetry collector for metrics, logs, traces</p>
