name: Release Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Add Helm repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo add kiali https://kiali.org/helm-charts
          helm repo update

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
          cat Chart.yaml

      - name: Update dependencies
        run: helm dependency update

      - name: Lint chart
        run: helm lint .

      - name: Package chart
        run: |
          mkdir -p packages
          helm package . -d packages

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)
          
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from ${PREV_TAG} to HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          
          # Escape for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "k8s-observability-stack v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          body: |
            ## k8s-observability-stack v${{ steps.version.outputs.version }}
            
            ### Installation
            
            ```bash
            # Add the Helm repository
            helm repo add k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack
            helm repo update
            
            # Install the chart
            helm install observability k8s-observability/k8s-observability-stack
            ```
            
            ### Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Assets
            
            - `k8s-observability-stack-${{ steps.version.outputs.version }}.tgz` - Helm chart package
          files: packages/*.tgz
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true

      - name: Checkout gh-pages branch
        id: checkout-gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Create gh-pages branch if not exists
        if: steps.checkout-gh-pages.outcome == 'failure'
        run: |
          # Remove any partial checkout
          rm -rf gh-pages
          
          # Create orphan gh-pages branch
          git clone --depth 1 https://github.com/${{ github.repository }}.git gh-pages-temp
          cd gh-pages-temp
          git checkout --orphan gh-pages
          git rm -rf .
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          echo "# Helm Chart Repository" > README.md
          git add README.md
          git commit -m "Initialize gh-pages branch"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
          cd ..
          rm -rf gh-pages-temp
          
          # Now checkout the newly created branch
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git gh-pages

      - name: Update Helm repository index
        run: |
          # Copy packaged chart
          cp packages/*.tgz gh-pages/
          
          # Generate or update index.yaml
          cd gh-pages
          if [ -f index.yaml ]; then
            helm repo index . --url https://theorigamicorporation.github.io/k8s-observability-stack --merge index.yaml
          else
            helm repo index . --url https://theorigamicorporation.github.io/k8s-observability-stack
          fi
          
          # Copy HTML template from repo
          cp ../.github/gh-pages-template.html index.html

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Release k8s-observability-stack v${{ steps.version.outputs.version }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Post release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully released **k8s-observability-stack** version **${{ needs.release.outputs.version || github.ref_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack" >> $GITHUB_STEP_SUMMARY
          echo "helm repo update" >> $GITHUB_STEP_SUMMARY
          echo "helm install observability k8s-observability/k8s-observability-stack" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
