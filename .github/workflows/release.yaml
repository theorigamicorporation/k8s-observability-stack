                  <code><span class="comment"># Add the Helm repository</span>
          <span class="command">helm repo add</span> k8s-observability https://theorigamicorporation.github.io/k8s-observability-stack
          <span class="command">helm repo update</span>

          <span class="comment"># Install with default configuration</span>
          <span class="command">helm install</span> observability k8s-observability/k8s-observability-stack \
            --namespace observability --create-namespace

          <span class="comment"># Access Grafana</span>
          <span class="command">kubectl port-forward</span> svc/observability-k8s-observability-stack-grafana-service 3000:3000 -n observability</code>
                </div>
              </div>

              <div class="section">
                <h2>Components</h2>
