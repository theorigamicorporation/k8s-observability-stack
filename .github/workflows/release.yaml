                    GitHub
                  </a>
                  <a href="https://github.com/theorigamicorporation/k8s-observability-stack/releases" class="btn btn-secondary">Releases</a>
                  <a href="https://github.com/theorigamicorporation/k8s-observability-stack/blob/main/README.md" class="btn btn-secondary">Documentation</a>
