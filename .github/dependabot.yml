# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automatically opens PRs to update GitHub Actions and other dependencies.
# Note: Helm chart dependencies are handled by our custom update-deps workflow.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "theorigamicorporation"
    open-pull-requests-limit: 5
    groups:
      # Group all GitHub Actions updates together
      github-actions:
        patterns:
          - "*"
