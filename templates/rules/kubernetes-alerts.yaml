{{- if and .Values.mixins.enabled .Values.mixins.kubernetes.alerts }}
# =============================================================================
# Kubernetes Alert Rules
# =============================================================================
# This is a placeholder file. To generate alerts from kubernetes-mixin:
#   1. Run: make mixins-install
#   2. Run: make generate-rules
#
# For now, basic alerts are provided inline. Full mixin-generated alerts
# will replace this content after running the above commands.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-observability-stack.fullname" . }}-kubernetes-alerts
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting-rules
data:
  kubernetes-alerts.yaml: |
    groups:
      - name: kubernetes-apps
        rules:
          - alert: KubePodCrashLooping
            annotations:
              description: 'Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is restarting frequently.'
              summary: Pod is crash looping.
            expr: |
              max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 15m
            labels:
              severity: warning
              {{- with .Values.mixins.alerts.additionalLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
          - alert: KubePodNotReady
            annotations:
              description: 'Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} has been in a non-ready state for longer than 15 minutes.'
              summary: Pod has been in a non-ready state for more than 15 minutes.
            expr: |
              sum by (namespace, pod) (
                max by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})
                * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (
                  1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
                )
              ) > 0
            for: 15m
            labels:
              severity: warning
              {{- with .Values.mixins.alerts.additionalLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
          - alert: KubeDeploymentReplicasMismatch
            annotations:
              description: 'Deployment {{`{{ $labels.namespace }}`}}/{{`{{ $labels.deployment }}`}} has not matched the expected number of replicas.'
              summary: Deployment has not matched expected number of replicas.
            expr: |
              (
                kube_deployment_spec_replicas != kube_deployment_status_replicas_available
              ) and (
                changes(kube_deployment_status_replicas_updated[10m]) == 0
              )
            for: 15m
            labels:
              severity: warning
              {{- with .Values.mixins.alerts.additionalLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
      - name: kubernetes-system
        rules:
          - alert: KubeNodeNotReady
            annotations:
              description: '{{`{{ $labels.node }}`}} has been unready for more than 15 minutes.'
              summary: Node is not ready.
            expr: |
              kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 15m
            labels:
              severity: warning
              {{- with .Values.mixins.alerts.additionalLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
          - alert: KubeNodeUnreachable
            annotations:
              description: '{{`{{ $labels.node }}`}} is unreachable.'
              summary: Node is unreachable.
            expr: |
              (kube_node_spec_taint{key="node.kubernetes.io/unreachable",effect="NoSchedule"}) == 1
            for: 15m
            labels:
              severity: warning
              {{- with .Values.mixins.alerts.additionalLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
{{- end }}
