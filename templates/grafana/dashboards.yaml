{{/*
=============================================================================
Additional Custom Dashboards from values
=============================================================================
*/}}
{{- range .Values.grafana.dashboards.additional }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "k8s-observability-stack.dashboardPrefix" $ }}-{{ .name | lower | replace " " "-" | trunc 50 }}
  namespace: {{ include "k8s-observability-stack.namespace" $ }}
  labels:
    {{- include "k8s-observability-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboard
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- if .folder }}
  folder: {{ .folder }}
  {{- end }}
  {{- if .url }}
  url: {{ .url }}
  {{- else if .grafanaComId }}
  grafanaCom:
    id: {{ .grafanaComId }}
    revision: {{ .grafanaComRevision | default 1 }}
  {{- else if .configMapRef }}
  configMapRef:
    name: {{ .configMapRef.name }}
    key: {{ .configMapRef.key | default "dashboard.json" }}
  {{- end }}
{{- end }}
{{- end }}
