{{- if and (index .Values "grafana-operator" "enabled") .Values.grafana.instance.enabled .Values.grafana.dashboards.enabled }}
{{/*
Dashboard Folders for organization
*/}}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ include "k8s-observability-stack.fullname" . }}-kubernetes
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-folder
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  title: Kubernetes
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ include "k8s-observability-stack.fullname" . }}-victoriametrics
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-folder
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  title: VictoriaMetrics

{{/*
=============================================================================
Dashboards from Grafana.com
These reference community-maintained dashboards by ID, ensuring they stay
up-to-date without hardcoding JSON in the chart.
=============================================================================
*/}}

{{/*
Kubernetes Dashboards from Grafana.com
*/}}
{{- if .Values.grafana.dashboards.providers.kubernetes.enabled }}
---
# Kubernetes / Views / Global
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "k8s-observability-stack.dashboardPrefix" . }}-k8s-global
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboard
    dashboard: kubernetes
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  folder: {{ include "k8s-observability-stack.fullname" . }}-kubernetes
  grafanaCom:
    id: 15757  # Kubernetes / Views / Global
    revision: 42
---
