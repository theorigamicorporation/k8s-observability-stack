{{/*
Grafana Admin Secret
Only created if:
1. Grafana operator and instance are enabled
2. NOT using an external secret (grafana.instance.adminCredentials.existingSecret is empty)
*/}}
{{- if and (index .Values "grafana-operator" "enabled") .Values.grafana.instance.enabled }}
{{- if not .Values.grafana.instance.adminCredentials.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-observability-stack.grafanaAdminSecretName" . }}
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with (include "k8s-observability-stack.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Keys must match Grafana env vars for operator envFrom injection
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.instance.adminCredentials.username | default "admin" | quote }}
  {{- if .Values.grafana.instance.adminCredentials.password }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.instance.adminCredentials.password | quote }}
  {{- else }}
  GF_SECURITY_ADMIN_PASSWORD: {{ randAlphaNum 16 | quote }}
  {{- end }}
{{- end }}
{{- end }}
