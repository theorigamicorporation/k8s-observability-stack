{{- if and (index .Values "grafana-operator" "enabled") .Values.grafana.instance.enabled .Values.grafana.datasources.autoCreate }}
{{/*
VictoriaMetrics / Prometheus Datasource
*/}}
{{- if .Values.grafana.datasources.victoriametrics.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" . }}-victoriametrics
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  datasource:
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    {{- if .Values.grafana.datasources.victoriametrics.url }}
    url: {{ .Values.grafana.datasources.victoriametrics.url }}
    {{- else }}
    url: {{ include "k8s-observability-stack.vmQueryUrl" . }}
    {{- end }}
    isDefault: {{ .Values.grafana.datasources.victoriametrics.isDefault | default true }}
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "30s"
      prometheusType: Prometheus
      prometheusVersion: "2.40.0"
{{- end }}

{{/*
Prometheus Datasource (alias for VictoriaMetrics for dashboard compatibility)
*/}}
{{- if .Values.grafana.datasources.victoriametrics.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" . }}-prometheus
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    {{- if .Values.grafana.datasources.victoriametrics.url }}
    url: {{ .Values.grafana.datasources.victoriametrics.url }}
    {{- else }}
    url: {{ include "k8s-observability-stack.vmQueryUrl" . }}
    {{- end }}
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "30s"
      prometheusType: Prometheus
      prometheusVersion: "2.40.0"
{{- end }}

{{/*
Loki Datasource
*/}}
{{- if and .Values.loki.enabled .Values.grafana.datasources.loki.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" . }}-loki
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: {{ include "k8s-observability-stack.lokiUrl" . }}
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        {{- if or .Values.victoriatraces.enabled .Values.jaeger.enabled }}
        - datasourceUid: tracing
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
        {{- end }}
{{- end }}

{{/*
Tracing Datasource (VictoriaTraces or Jaeger)
*/}}
{{- if and .Values.grafana.datasources.tracing.enabled (eq (include "k8s-observability-stack.tracingEnabled" .) "true") }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" . }}-tracing
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  datasource:
    name: Tracing
    uid: tracing
    {{- if .Values.victoriatraces.enabled }}
    type: tempo
    {{- else if .Values.jaeger.enabled }}
    type: jaeger
    {{- end }}
    access: proxy
    url: {{ include "k8s-observability-stack.tracingUrl" . }}
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: {{ include "k8s-observability-stack.datasourcePrefix" . }}-victoriametrics
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
{{- end }}

{{/*
Alertmanager Datasource
*/}}
{{- if .Values.alertmanager.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" . }}-alertmanager
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  datasource:
    name: Alertmanager
    type: alertmanager
    access: proxy
    url: {{ include "k8s-observability-stack.alertmanagerUrl" . }}
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
{{- end }}

{{/*
Additional Custom Datasources
*/}}
{{- range .Values.grafana.datasources.additional }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ include "k8s-observability-stack.datasourcePrefix" $ }}-{{ .name | lower | replace " " "-" }}
  namespace: {{ include "k8s-observability-stack.namespace" $ }}
  labels:
    {{- include "k8s-observability-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-observability-stack.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  datasource:
    name: {{ .name }}
    type: {{ .type }}
    access: {{ .access | default "proxy" }}
    url: {{ .url }}
    isDefault: {{ .isDefault | default false }}
    editable: {{ .editable | default false }}
    {{- with .jsonData }}
    jsonData:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .secureJsonData }}
    secureJsonData:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
