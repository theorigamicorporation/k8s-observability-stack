{{- if .Values.vmalert.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-observability-stack.vmalertName" . }}-rules
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmalert
data:
  kubernetes-alerts.yaml: |
    groups:
      - name: kubernetes-apps
        rules:
          - alert: KubePodCrashLooping
            annotations:
              description: 'Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is restarting {{`{{ printf "%.2f" $value }}`}} times / 10 minutes.'
              summary: Pod is crash looping.
            expr: |
              max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 15m
            labels:
              severity: warning
          - alert: KubePodNotReady
            annotations:
              description: 'Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} has been in a non-ready state for longer than 15 minutes.'
              summary: Pod has been in a non-ready state for more than 15 minutes.
            expr: |
              sum by (namespace, pod) (
                max by(namespace, pod) (
                  kube_pod_status_phase{phase=~"Pending|Unknown"}
                ) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (
                  1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
                )
              ) > 0
            for: 15m
            labels:
              severity: warning
          - alert: KubeDeploymentReplicasMismatch
            annotations:
              description: 'Deployment {{`{{ $labels.namespace }}`}}/{{`{{ $labels.deployment }}`}} has not matched the expected number of replicas for longer than 15 minutes.'
              summary: Deployment has not matched expected number of replicas.
            expr: |
              (
                kube_deployment_spec_replicas
                  !=
                kube_deployment_status_replicas_available
              ) and (
                changes(kube_deployment_status_replicas_updated[10m])
                  ==
                0
              )
            for: 15m
            labels:
              severity: warning
      - name: kubernetes-resources
        rules:
          - alert: KubeCPUOvercommit
            annotations:
              description: 'Cluster has overcommitted CPU resource requests and cannot tolerate node failure.'
              summary: Cluster has overcommitted CPU resource requests.
            expr: |
              sum(namespace_cpu:kube_pod_container_resource_requests:sum)
                /
              sum(kube_node_status_allocatable{resource="cpu"})
                >
              (count(kube_node_info) - 1) / count(kube_node_info)
            for: 10m
            labels:
              severity: warning
          - alert: KubeMemoryOvercommit
            annotations:
              description: 'Cluster has overcommitted memory resource requests and cannot tolerate node failure.'
              summary: Cluster has overcommitted memory resource requests.
            expr: |
              sum(namespace_memory:kube_pod_container_resource_requests:sum)
                /
              sum(kube_node_status_allocatable{resource="memory"})
                >
              (count(kube_node_info) - 1) / count(kube_node_info)
            for: 10m
            labels:
              severity: warning
      - name: kubernetes-system
        rules:
          - alert: KubeNodeNotReady
            annotations:
              description: '{{`{{ $labels.node }}`}} has been unready for more than 15 minutes.'
              summary: Node is not ready.
            expr: |
              kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 15m
            labels:
              severity: warning
          - alert: KubeNodeUnreachable
            annotations:
              description: '{{`{{ $labels.node }}`}} is unreachable and some workloads may be rescheduled.'
              summary: Node is unreachable.
            expr: |
              (kube_node_spec_taint{key="node.kubernetes.io/unreachable",effect="NoSchedule"} unless ignoring(key,value) kube_node_spec_taint{key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"}) == 1
            for: 15m
            labels:
              severity: warning
  victoriametrics-alerts.yaml: |
    groups:
      - name: victoriametrics
        rules:
          - alert: VictoriaMetricsHighMemoryUsage
            annotations:
              description: 'VictoriaMetrics is using more than 80% of available memory.'
              summary: High memory usage on VictoriaMetrics.
            expr: |
              (process_resident_memory_bytes / vm_available_memory_bytes) * 100 > 80
            for: 5m
            labels:
              severity: warning
          - alert: VictoriaMetricsTooManyActiveTimeSeries
            annotations:
              description: 'VictoriaMetrics has too many active time series.'
              summary: Too many active time series.
            expr: |
              vm_cache_entries{type="storage/hour_metric_ids"} > 1000000
            for: 5m
            labels:
              severity: warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-observability-stack.vmalertName" . }}
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmalert
spec:
  replicas: {{ .Values.vmalert.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "k8s-observability-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vmalert
  template:
    metadata:
      labels:
        {{- include "k8s-observability-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: vmalert
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/victoriametrics/vmalert.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.global.priorityClassName }}
      priorityClassName: {{ .Values.global.priorityClassName }}
      {{- end }}
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.96.0
          imagePullPolicy: IfNotPresent
          args:
            - "-rule=/config/*.yaml"
            - "-datasource.url={{ include "k8s-observability-stack.vmQueryUrl" . }}"
            - "-remoteWrite.url={{ include "k8s-observability-stack.vmWriteUrl" . }}"
            - "-remoteRead.url={{ include "k8s-observability-stack.vmQueryUrl" . }}"
            {{- if .Values.alertmanager.enabled }}
            - "-notifier.url={{ include "k8s-observability-stack.alertmanagerUrl" . }}"
            {{- end }}
            - "-external.label=cluster={{ include "k8s-observability-stack.clusterName" . }}"
            {{- range $key, $value := .Values.vmalert.extraArgs }}
            - "-{{ $key }}={{ $value }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 8880
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with .Values.vmalert.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: rules
              mountPath: /config
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: {{ include "k8s-observability-stack.vmalertName" . }}-rules
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-observability-stack.vmalertName" . }}
  namespace: {{ include "k8s-observability-stack.namespace" . }}
  labels:
    {{- include "k8s-observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmalert
spec:
  type: ClusterIP
  ports:
    - port: 8880
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "k8s-observability-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vmalert
{{- end }}
